<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research papers – Meridian Research Hub</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="papers">
<div id="site-header"></div>

<main class="container">
  <header class="page-head">
    <h1>Research papers</h1>
    <p class="muted">Search the repository and narrow results by subject, author and year.</p>
  </header>

  <div class="papers-layout">
    <form class="card filters" id="filters" role="search" aria-label="Filter papers">
      <div class="field"><label for="q">Keyword search</label>
        <input id="q" type="search" placeholder="Title, abstract or keyword"></div>
      <div class="field"><label for="area">Subject</label><select id="area"><option value="">All subjects</option></select></div>
      <div class="field"><label for="author">Author</label><select id="author"><option value="">All authors</option></select></div>
      <div class="field"><label for="year">Year</label><select id="year"><option value="">All years</option></select></div>
      <div class="field"><label for="sort">Sort by</label>
        <select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="popular">Most viewed</option><option value="title">Title A–Z</option></select></div>
      <button class="btn" type="reset" id="reset">Clear filters</button>
    </form>

    <section aria-live="polite">
      <div class="results-bar"><strong id="count"></strong></div>
      <div class="grid grid-2" id="results"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const pool = approvedPapers();
  const params = new URLSearchParams(location.search);

  // populate dropdowns
  AREAS.forEach(a => $("#area").insertAdjacentHTML("beforeend", `<option>${esc(a)}</option>`));
  RESEARCHERS.forEach(r => $("#author").insertAdjacentHTML("beforeend", `<option value="${esc(r.name.split(" ").pop())}">${esc(r.name)}</option>`));
  [...new Set(pool.map(p => p.year))].sort((a, b) => b - a)
    .forEach(y => $("#year").insertAdjacentHTML("beforeend", `<option>${y}</option>`));

  // initial values from the URL (e.g. coming from the home page)
  $("#q").value = params.get("q") || "";
  $("#area").value = params.get("area") || "";
  $("#author").value = params.get("author") || "";

  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const area = $("#area").value, author = $("#author").value.toLowerCase(), year = $("#year").value;
    let list = pool.filter(p => {
      if (area && p.area !== area) return false;
      if (year && String(p.year) !== year) return false;
      if (author && !p.authors.toLowerCase().includes(author)) return false;
      if (q) {
        const hay = [p.title, p.abstract, p.authors, p.area, p.keywords.join(" ")].join(" ").toLowerCase();
        if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
      }
      return true;
    });
    const sort = $("#sort").value;
    list.sort((a, b) => sort === "oldest" ? a.year - b.year : sort === "popular" ? b.views - a.views : sort === "title" ? a.title.localeCompare(b.title) : b.year - a.year);
    $("#count").textContent = `${list.length} ${list.length === 1 ? "paper" : "papers"} found`;
    $("#results").innerHTML = list.length ? list.map(paperCard).join("")
      : `<div class="empty" style="grid-column:1/-1">No papers match these filters. Try removing a filter or using fewer keywords.</div>`;
  }
  $("#filters").addEventListener("input", render);
  $("#filters").addEventListener("submit", e => e.preventDefault());
  $("#reset").addEventListener("click", () => setTimeout(render, 0));
  render();
</script>
</body>
</html>
