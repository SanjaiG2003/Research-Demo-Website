<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved papers – Meridian Research Hub</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="saved">
<div id="site-header"></div>

<main class="container">
  <header class="page-head">
    <h1>Saved papers</h1>
    <p class="muted">Papers you have bookmarked for later reading.</p>
  </header>
  <div class="grid grid-3" id="list" style="padding-bottom:40px"></div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  function renderSaved() {
    const ids = getSaved();
    const papers = approvedPapers().filter(p => ids.includes(p.id));
    $("#list").innerHTML = papers.length ? papers.map(paperCard).join("")
      : `<div class="empty" style="grid-column:1/-1"><p>You have not saved any papers yet.</p><a class="btn btn-primary" href="papers.html">Browse papers</a></div>`;
  }
  renderSaved();
</script>
</body>
</html>
